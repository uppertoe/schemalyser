# Runs the project's correctness tests on GitHub's machines whenever the main branch changes.
# Everything here works on invented data that is already public in this repository. No hospital
# data, no private world and no licensed vocabulary is involved: the SQL Server job builds a
# throwaway server with a password made up for the run, loads the invented world into it, and
# throws it away at the end.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the core tests
        working-directory: core
        run: uv run --with sqlglot==30.21.0 --with duckdb==1.5.1 --with pytest python -m pytest -q

  page:
    name: Page tests (Chromium and Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install the page's dependencies
        working-directory: site
        run: npm ci
      - name: Install the browsers
        working-directory: site
        run: npx playwright install --with-deps chromium firefox
      - name: Build the page
        working-directory: site
        run: npm run build
      - name: Run the page tests
        working-directory: site
        run: npx playwright test --project=chromium --project=firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 3

  sqlserver:
    name: SQL Server harness (invented world)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start a throwaway SQL Server with a password made up for this run
        run: |
          set -eu
          mkdir -p reference
          password="Run$(openssl rand -hex 12)!A1"
          printf '%s' "$password" > reference/mssql-password.txt
          MSSQL_SA_PASSWORD="$password" docker run -d --name schemalyser-mssql \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            -p 127.0.0.1:14330:1433 --memory 4g mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD="$password" schemalyser-mssql /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -C -Q "SELECT 1" >/dev/null 2>&1; then echo "SQL Server is up after about $((i * 2)) seconds"; break; fi
            sleep 2
          done
      - name: Run the harness on the invented world, with the safeguards
        working-directory: core
        run: uv run --with sqlglot==30.21.0 --with duckdb==1.5.1 python ../tools/sqlserver/harness.py --sample-vocabulary
      - name: Remove the server
        if: always()
        run: docker rm -f schemalyser-mssql >/dev/null 2>&1 || true
