[project]
name = "schemalyser"
version = "0.1.0"
description = "The reusable anaesthesia record export: a hospital schema with its evidence, a role model, and the compilation of questions and conversions over it."
requires-python = ">=3.11"
dependencies = ["sqlglot==30.21.0"]

[dependency-groups]
dev = ["pytest>=8", "duckdb==1.5.1", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fast suite is python -m pytest -m "not slow"; docs/testing.md gives both invocations and how long each takes.
markers = [
    "slow: takes more than thirty seconds, or runs the testbed's full profile or SQL Server; the fast suite deselects it",
]
