[project]
name = "schemalyser"
version = "0.1.0"
description = "The reusable anaesthesia record export: a hospital schema with its evidence, a role model, and the compilation of questions and conversions over it."
requires-python = ">=3.11"
dependencies = ["sqlglot==30.21.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
