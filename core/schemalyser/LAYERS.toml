# The layer of every module of the core, as docs/contract.md defines the layers. tests/test_contract.py reads this
# file and checks every import against the dependency rules in section 6 of the contract.
#
# A layer is one of "1" (the role model), "2" (the hospital schema), "3" (compilation and reports), "4" (test worlds
# and the testbed), "orchestration", "5" (surfaces), "adapter" (the reference adapters), "superseded", or "shared".
# Section 6 of the contract names the shared tier: utilities with no knowledge of any layer, which any layer may import
# and which import only from the tier itself. Here "shared" holds the vendor-free utilities that every layer uses
# (reading files, parsing and translating T-SQL, the allowlist of names, memoisation, the fixed vocabulary), and the
# test lets any module import a shared one and a shared module import only another shared one.
#
# A note says why an assignment is arguable.

[modules]
"schemalyser" = { layer = "shared", note = "The package's marker, which imports nothing of the package." }
"schemalyser.catalogue" = { layer = "shared" }
"schemalyser.extract" = { layer = "shared", note = "Safe reading of files, and the finding of facts in a request, which the synthetic world's analysis (harness.py) and the release's list of the source columns that the steps read (release.py) both use. It knows nothing of any layer." }
"schemalyser.statements" = { layer = "shared" }
"schemalyser.translate" = { layer = "shared", note = "The DuckDB translation is layer 4's work, but the first ask of the hospital schema (layer 2) and the conversion's format and routes (layer 3) read its names of the OMOP schema as well." }
"schemalyser.memo" = { layer = "shared" }
"schemalyser.blanking" = { layer = "shared", note = "The blanking of small counts in a result, which the two-part script and the query compiled through a map (compiler.py) both use." }
"schemalyser.vocabulary" = { layer = "shared" }
"schemalyser.selects" = { layer = "shared", note = "The rule that a text of T-SQL is one SELECT that only reads, which the release script (layer 3), the map's own checks (layer 2) and the compilation of a question (layer 3) all apply. It reads T-SQL and nothing else." }
"schemalyser.datadict" = { layer = "shared", note = "The reader of a data dictionary file, which the hospital schema (layer 2) and the reference adapter's transplant both read. It imports only the shared tier and knows nothing of any layer: it reads a plain table of tables, columns and descriptions." }
"schemalyser.summaries" = { layer = "shared", note = "By its purpose it is orchestration, but the reference adapters that write two of the three named summaries may import only layers 1 and 3 and the shared tier, and the scoreboard sits in layer 2, so the exporters import nothing from the package and take each output as data." }

"schemalyser.rolemap" = { layer = "2", note = "It loads contract.json (layer 1) and reads and writes maps (layer 2). The compilation of a query through a map is compiler.py's, the role-level shadow is roleshadow.py's, and the command line is rolemap/__main__.py's." }
"schemalyser.describe" = { layer = "2", note = "The saved hospital schema and every operation that writes it; it is also the core behind the Describe screen." }
"schemalyser.propose" = { layer = "2" }
"schemalyser.corrections" = { layer = "2", note = "The correction forms and how they are written into the map. The shadow on which a correction is tested is roleshadow.py's." }
"schemalyser.first_ask" = { layer = "2" }
"schemalyser.evidence" = { layer = "2", note = "The append-only journal, the dimensions records and the identity of each saved version." }
"schemalyser.normalise" = { layer = "2", note = "The named normalisations of the map, written and read at the file's boundary." }

"schemalyser.feasibility" = { layer = "3" }
"schemalyser.compiler" = { layer = "3", note = "Compilation through a hospital schema: a query over the roles compiled with a map into one statement, and an audit compiled into the two-part script, with its specification." }
"schemalyser.conversion" = { layer = "3", note = "The conversion folder's format: conversion.json, its steps, layers, routes and alternatives, the custom tables, the counts, the draft marker and the held-out root, which the runner, the release script and the transplant all read." }
"schemalyser.policy" = { layer = "3" }
"schemalyser.rolepolicy" = { layer = "3" }
"schemalyser.release" = { layer = "3" }
"schemalyser.mapping" = { layer = "3", note = "It proposes mapping rows for a conversion; the conversion steps are layer 3's." }
"schemalyser.routes" = { layer = "3", note = "It chooses a route for each step of a conversion, which is part of writing the steps." }
"schemalyser.capability" = { layer = "3", note = "It reads the SQL of a capability of the catalogue and fills its parameters, which is the first stage of compiling a derived section." }
"schemalyser.specification" = { layer = "3", note = "The first stage of compilation: a specification of an export into SQL over the roles." }

"schemalyser.testbed" = { layer = "4" }
"schemalyser.convert" = { layer = "4", note = "It runs a conversion over the synthetic database and checks what it writes. The conversion folder's format is conversion.py's, which it reads by the same names as before." }
"schemalyser.roleshadow" = { layer = "4", note = "The role-level shadow with its planted cases, the map's shadow on which a hospital schema and a correction are tested, the hospital run of a world, and the correctness report of an execution package. It runs the test that a sitting of screen 1 owes and hands the result back to the sitting as data." }
"schemalyser.harness" = { layer = "4", note = "The synthetic world: the analysis of its requests, the checks that its stand-in database answers and the script that writes them, which the conversion's run and the SQL Server harness both use." }
"schemalyser.sample_vocabulary" = { layer = "4", note = "A few public concepts for the fast profile, which the testbed and the SQL Server harness both write." }
"schemalyser.hospital" = { layer = "4" }
"schemalyser.sandbox" = { layer = "4", note = "The synthetic database, with the reader of the check results from which it builds its values." }
"schemalyser.realistic" = { layer = "4" }
"schemalyser.roles" = { layer = "4", note = "What a column means for the synthetic database, which has nothing to do with the role model despite its name." }
"schemalyser.tuning" = { layer = "4" }
"schemalyser.rules" = { layer = "4", note = "The site rules file, which only the synthetic world reads." }
"schemalyser.realism.build_data" = { layer = "4" }

"schemalyser.audit" = { layer = "orchestration", note = "It assembles the execution package from layer 3's compilation (compiler.py) and reports, and reads the correctness report that the role shadow (roleshadow.py) writes into the package." }
"schemalyser.plan" = { layer = "orchestration", note = "The plan review is one of the package's contents, and it takes its wording from audit.py." }
"schemalyser.project" = { layer = "orchestration", note = "The project folder, which the workbench and the import from the public workspace both use; it reads the version from audit.py and checks a schema with feasibility.py." }
"schemalyser.workspace" = { layer = "orchestration", note = "The export is a projection rather than a layer, and the import builds a package in a hospital's project, so it sits with the package assembler." }
"schemalyser.results" = { layer = "orchestration", note = "The results package, written from an execution package and a production run's output; it stays inside the hospital." }

"schemalyser.browser" = { layer = "5" }
"schemalyser.describe.__main__" = { layer = "5", note = "The command line of the hospital schema, which python -m schemalyser.describe runs, with the walk of the page's calls." }
"schemalyser.rolemap.__main__" = { layer = "5", note = "The command line of the roles and the maps, which python -m schemalyser.rolemap runs." }
"schemalyser.workbench" = { layer = "5" }
"schemalyser.workbench.__main__" = { layer = "5" }
"schemalyser.workbench.app" = { layer = "5" }
"schemalyser.workbench.jobs" = { layer = "5" }

"schemalyser.compare" = { layer = "adapter" }
"schemalyser.transplant" = { layer = "adapter" }
