# The layer of every module of the core, as docs/contract.md defines the layers. tests/test_contract.py reads this
# file and checks every import against the dependency rules in section 6 of the contract.
#
# A layer is one of "1" (the role model), "2" (the hospital schema), "3" (compilation and reports), "4" (test worlds
# and the testbed), "orchestration", "5" (surfaces), "adapter" (the reference adapters), "superseded", or "shared".
# Section 6 of the contract names the shared tier: utilities with no knowledge of any layer, which any layer may import
# and which import only from the tier itself. Here "shared" holds the vendor-free utilities that every layer uses
# (reading files, parsing and translating T-SQL, the allowlist of names, memoisation, the fixed vocabulary), and the
# test lets any module import a shared one and a shared module import only another shared one.
#
# A note says why an assignment is arguable.

[modules]
"schemalyser" = { layer = "shared", note = "The package's marker. It still exports the earlier analyser, so that importing any module of the core runs analysis.py." }
"schemalyser.catalogue" = { layer = "shared" }
"schemalyser.extract" = { layer = "shared", note = "Safe reading of files is shared; its finding of facts in a request belongs to the earlier design, and it still imports checks.py and skeleton.py." }
"schemalyser.statements" = { layer = "shared" }
"schemalyser.translate" = { layer = "shared", note = "The DuckDB translation is layer 4's work, but layer 2's test of a correction on made-up rows uses it as well." }
"schemalyser.memo" = { layer = "shared" }
"schemalyser.vocabulary" = { layer = "shared" }

"schemalyser.rolemap" = { layer = "2", note = "It loads contract.json (layer 1), reads and writes maps (layer 2), compiles an audit through a map (layer 3) and builds the role-level shadow (layer 4). Layer 2 is where the most of it sits." }
"schemalyser.describe" = { layer = "2", note = "The saved hospital schema and every operation that writes it; it is also the core behind the Describe screen." }
"schemalyser.propose" = { layer = "2" }
"schemalyser.corrections" = { layer = "2" }
"schemalyser.datadict" = { layer = "2" }
"schemalyser.first_ask" = { layer = "2" }
"schemalyser.evidence" = { layer = "2", note = "The append-only journal, the dimensions records and the identity of each saved version." }
"schemalyser.normalise" = { layer = "2", note = "The named normalisations of the map, written and read at the file's boundary." }

"schemalyser.feasibility" = { layer = "3" }
"schemalyser.policy" = { layer = "3" }
"schemalyser.rolepolicy" = { layer = "3" }
"schemalyser.release" = { layer = "3" }
"schemalyser.mapping" = { layer = "3", note = "It proposes mapping rows for a conversion; the conversion steps are layer 3's." }
"schemalyser.routes" = { layer = "3", note = "It chooses a route for each step of a conversion, which is part of writing the steps." }

"schemalyser.testbed" = { layer = "4" }
"schemalyser.convert" = { layer = "4", note = "It runs a conversion over the synthetic database and checks what it writes, which is layer 4's; it also defines the conversion folder's format, which release.py takes from it." }
"schemalyser.harness" = { layer = "4" }
"schemalyser.sample_vocabulary" = { layer = "4", note = "A few public concepts for the fast profile, which the testbed and the SQL Server harness both write." }
"schemalyser.hospital" = { layer = "4" }
"schemalyser.sandbox" = { layer = "4" }
"schemalyser.realistic" = { layer = "4" }
"schemalyser.roles" = { layer = "4", note = "What a column means for the synthetic database, which has nothing to do with the role model despite its name." }
"schemalyser.tuning" = { layer = "4" }
"schemalyser.rules" = { layer = "4", note = "The site rules file, which only the synthetic database and superseded modules read." }
"schemalyser.realism.build_data" = { layer = "4" }
"schemalyser.concepts" = { layer = "4", note = "The names of a conversion's concepts; it reads them through convert.py, and only target.py imports it, so it retires with target.py." }
"schemalyser.dictionary" = { layer = "4", note = "The data dictionary of a conversion, read through convert.py; only target.py imports it, so it retires with target.py, as does its own import of target.py and questions.py." }

"schemalyser.audit" = { layer = "orchestration", note = "It assembles the execution package. compile_audit, script and specification are layer 3's compilation and could move to a module of their own." }
"schemalyser.plan" = { layer = "orchestration", note = "The plan review is one of the package's contents, and it takes its wording from audit.py." }
"schemalyser.project" = { layer = "orchestration", note = "The project folder, which the workbench and the import from the public workspace both use; it reads the version from audit.py and checks a schema with feasibility.py." }
"schemalyser.workspace" = { layer = "orchestration", note = "The export is a projection rather than a layer, and the import builds a package in a hospital's project, so it sits with the package assembler." }

"schemalyser.browser" = { layer = "5" }
"schemalyser.workbench" = { layer = "5" }
"schemalyser.workbench.__main__" = { layer = "5" }
"schemalyser.workbench.app" = { layer = "5" }
"schemalyser.workbench.jobs" = { layer = "5" }

"schemalyser.compare" = { layer = "adapter" }
"schemalyser.transplant" = { layer = "adapter" }

"schemalyser.__main__" = { layer = "superseded" }
"schemalyser.analysis" = { layer = "superseded" }
"schemalyser.boundary" = { layer = "superseded" }
"schemalyser.checks" = { layer = "superseded" }
"schemalyser.charted" = { layer = "superseded" }
"schemalyser.facts" = { layer = "superseded" }
"schemalyser.profile" = { layer = "superseded", note = "The profile of a core OMOP database. It was layer 3 on paper, but only superseded modules (boundary.py, questions.py, target.py) and the page's bridge for the earlier pages import it, and it imports checks.py, so it goes with the earlier design. If the OMOP layer needs a core profile, it returns to layer 3 once it no longer imports checks.py." }
"schemalyser.questions" = { layer = "superseded" }
"schemalyser.restructure" = { layer = "superseded" }
"schemalyser.scripts" = { layer = "superseded" }
"schemalyser.skeleton" = { layer = "superseded" }
"schemalyser.sql_evidence" = { layer = "superseded" }
"schemalyser.target" = { layer = "superseded" }
