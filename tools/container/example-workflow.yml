# AN EXAMPLE, which has not been run. It belongs in the owner's private state repository, as
# .github/workflows/boundary.yml, once every placeholder in capitals has been filled in.
#
# On each commit to the state repository, the job checks out the state at that commit and the
# analytics team's requests at a pinned commit, runs the boundary image with no network and with
# both checkouts mounted read-only, and keeps the output folder as an artefact. It commits nothing
# and pushes nothing: a person downloads the artefact, reads summary.md, and commits what they
# have read. No step prints the contents of any file.
#
# Every action is pinned by the full commit SHA of a release, and each SHA_OF_... placeholder must
# be replaced with the SHA of the release named in the comment beside it.

name: Boundary run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boundary-${{ github.ref }}
  cancel-in-progress: false

env:
  # The boundary image, pulled by digest from the hospital's own registry.
  IMAGE: REGISTRY.EXAMPLE/schemalyser-boundary@sha256:DIGEST_OF_THE_REVIEWED_IMAGE
  # The commit of the analytics team's repository to read. A full commit SHA, changed by a person.
  REQUESTS_COMMIT: FULL_SHA_OF_THE_REQUESTS_COMMIT

jobs:
  boundary:
    # A runner inside the hospital's network, which the hospital controls.
    runs-on: [self-hosted, RUNNER_LABEL]
    timeout-minutes: 30
    steps:
      - name: Check out the state repository at the triggering commit
        uses: actions/checkout@SHA_OF_ACTIONS_CHECKOUT  # v4.x.y
        with:
          path: state
          persist-credentials: false

      - name: Check out the requests repository at the pinned commit
        uses: actions/checkout@SHA_OF_ACTIONS_CHECKOUT  # v4.x.y
        with:
          repository: ORGANISATION/REQUESTS_REPOSITORY
          ref: ${{ env.REQUESTS_COMMIT }}
          # A fine-grained token that can only read the requests repository.
          token: ${{ secrets.REQUESTS_READ_TOKEN }}
          path: requests
          persist-credentials: false

      - name: Pull the boundary image
        run: docker pull --quiet "$IMAGE" > /dev/null

      - name: Run the boundary with no network and read-only inputs
        run: |
          set -eu
          mkdir out
          state_commit="$(git -C state rev-parse HEAD)"
          requests_commit="$(git -C requests rev-parse HEAD)"
          docker run --rm --network none --read-only --tmpfs /tmp \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/state:/state:ro" -v "$PWD/requests:/requests:ro" -v "$PWD/out:/out" \
            "$IMAGE" --state-commit "$state_commit" --requests-commit "$requests_commit"

      - name: Keep the output folder as an artefact
        # The outputs name the tables and columns of the hospital's database, so they are confidential.
        # Anyone who can read this repository can download an artefact while it is kept. Keep this step
        # only if that is acceptable, and otherwise copy the folder to a store inside the hospital.
        # The outputs are kept when a target query could not be read as well, because summary.md says which.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@SHA_OF_ACTIONS_UPLOAD_ARTIFACT  # v4.x.y
        with:
          name: boundary-${{ github.sha }}
          path: out/
          if-no-files-found: ignore
          retention-days: 1
